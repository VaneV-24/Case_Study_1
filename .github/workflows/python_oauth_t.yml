# adapted from https://docs.github.com/en/actions/tutorials/build-and-test-code/python
# this should pull the oauth_pytest.py file to check if there is a line for the token in the code
name: HF API Key Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        
    - name: Test with pytest
      run: |
        pytest oauth_test.py
